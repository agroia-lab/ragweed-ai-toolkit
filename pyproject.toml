[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ragweed-ai-toolkit"
version = "0.1.0"
description = "Multi-scale AI toolkit for weed detection, mapping, and spatial analysis"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Lorenzo León", email = "lorenzo.leon@inia.cl"},
]
keywords = [
    "weed-detection",
    "precision-agriculture",
    "yolo",
    "spatial-analysis",
    "remote-sensing",
    "deep-learning",
    "geostatistics",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Image Recognition",
]

dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "geopandas>=0.14",
    "matplotlib>=3.7",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "tqdm>=4.65",
    "pillow>=10.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
detection = [
    "ultralytics>=8.4.0",
    "sahi>=0.11",
    "opencv-python>=4.8",
]
embeddings = [
    "torch>=2.0",
    "torchvision>=0.15",
    "umap-learn>=0.5",
]
spatial = [
    "pygeoda>=0.0.8",
    "esda>=2.5",
    "libpysal>=4.9",
    "mgwr>=2.2",
    "spreg>=1.4",
]
satellite = [
    "earthengine-api>=0.1.380",
    "rasterio>=1.3",
    "rasterstats>=0.19",
]
orthomosaic = [
    "rasterio>=1.3",
]
viz = [
    "plotly>=5.15",
    "matplotlib-scalebar>=0.8",
]
all = [
    "ragweed-ai-toolkit[detection,embeddings,spatial,satellite,orthomosaic,viz]",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1",
    "pre-commit>=3.0",
]

[project.scripts]
ragweed-train = "ragweed_toolkit.detection.trainer:main"
ragweed-sahi = "ragweed_toolkit.detection.inference:main"
ragweed-embed = "ragweed_toolkit.embeddings.extractor:main"
ragweed-mmd = "ragweed_toolkit.embeddings.mmd:main"
ragweed-tile = "ragweed_toolkit.orthomosaic.tiling:main"
ragweed-kriging = "ragweed_toolkit.geostatistics.kriging:main"
ragweed-lisa = "ragweed_toolkit.spatial.lisa:main"
ragweed-indices = "ragweed_toolkit.satellite.indices:main"

[project.urls]
Homepage = "https://github.com/agroia-lab/ragweed-ai-toolkit"
Documentation = "https://github.com/agroia-lab/ragweed-ai-toolkit#readme"
Repository = "https://github.com/agroia-lab/ragweed-ai-toolkit"
Issues = "https://github.com/agroia-lab/ragweed-ai-toolkit/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/ragweed_toolkit"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
